apiVersion: apps/v1
kind: Deployment

metadata:
  name: sample-api
  labels:
    app: sample-api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: sample-api

  template:
    metadata:
      labels:
        app: sample-api

    spec:
      containers:
        - name: sample-api
          image: vibhord/sample-api:does-not-exist
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: sample-api-config

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20

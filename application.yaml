apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api
  namespace: argocd

spec:
  project: default

  source: 
    repoURL: https://github.com/vibhord-work/sample-api.git
    targetRevision: main
    path: k8s

  destination: 
    server: https://kubernetes.default.svc
    namespace: gitops-demo
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true